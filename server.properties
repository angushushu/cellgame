# CellGame 服务器设置（server.properties）
# 格式：key=value。值留空表示使用默认值；命令行参数会覆盖这里的设置。


# ---- 网络 ----
# 监听地址；0.0.0.0 允许局域网玩家加入，127.0.0.1 只允许本机
server-ip=0.0.0.0
# 游戏端口，玩家连接 ws://服务器IP:这个端口
server-port=8765
# 服务器观察页面的端口：http://localhost:这个端口/
web-port=8080

# ---- 世界 ----
# 内置世界：balanced 均衡 / lush 丰饶 / challenging 挑战 / deep-dive 深潜（毯感知、隐藏信息）/ go 围棋生态
world-preset=balanced
# 可选：Python 世界规则文件（相对于本文件的路径）；填写后取代 world-preset。文件可定义 MANIFEST、on_epoch、on_event
world-rules=
# 每个时刻的毫秒数，越小世界越快
tick-ms=3000
# 世界种子；留空时公开地图的世界为 0，地图不公开的世界随机
seed=
# 可选：把世界回放保存到这个新文件（不会覆盖已有文件）
record=

# ---- 感知与可见性 ----
# 感知方式，留空则用世界本身的设置：legacy 全图 / radius 半径 / blanket 毯感知
perception=
# radius 的感知半径，或 blanket 边界细胞的外部感知半径
sense-radius=
# 感知范围形状：chebyshev 方形 / euclidean 圆形
perception-metric=
# 观察页面是否显示地图：full 显示 / none 不显示（防止看全图作弊）
spectator-map=

# ---- 战斗 ----
# 相连细胞的整体防御：防御额外加上相连邻居能量的百分比（0 关闭）
bonded-support-percent=

# ---- 经济参数 ----
# 移动一格消耗的能量
move-cost=2
# 攻击细胞消耗的能量
attack-cost=3
# 推动方块时接触方块的每个细胞额外消耗的能量
push-cost=0
# 攻击并破坏方块消耗的能量
block-attack-cost=3
# 繁殖时父细胞消耗的能量
reproduce-cost=8
# 改变细胞类型（如变装甲）消耗的能量
change-cost=1
# 繁殖所需的最低能量（物种设置无法低于它）
reproduce-min-energy=10
# 新生细胞的初始能量
child-energy=5
# 每次进食最多获得的能量
eat-gain=5
# 击败敌方细胞后获得其能量的百分比
attack-reward-percent=50
# 装甲细胞的额外防御
armor-defense-bonus=3
# 装甲细胞移动的额外消耗
armor-move-surcharge=1
